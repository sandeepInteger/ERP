# Docker test stack: the SPA plus /api proxied to the api container, so the browser sees one
# origin (refresh cookie and the Microsoft callback work exactly as behind the real load balancer).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Matches the API's upload limit (25 MB) with some headroom for multipart overhead.
    client_max_body_size 30m;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:3000/health;
    }

    location / {
        try_files $uri /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
}
