<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Integer ERP</title>
    <!-- Apply the saved theme (else the OS setting) before first paint; see src/lib/theme.ts. -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem("erp-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <!-- Loaded without blocking: on a weak phone signal the app must not wait for the font (it falls back
         to the system font, then switches). A blocking stylesheet here kept the app blank offline. -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
